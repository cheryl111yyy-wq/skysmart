<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SkySmart ✈ - Smart Flight Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #030712; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Premium Soft Glassmorphism Panel Layer */
        .glass-panel {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* Highly Refined Platform Brand Card Visual Vectors */
        .brand-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(15, 23, 42, 0.55); 
            border-radius: 1.25rem; 
            padding: 1.25rem 1rem; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.04); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .brand-card:hover { transform: translateY(-4px); background: #0f172a; border-color: #38bdf8; box-shadow: 0 12px 30px -5px rgba(56,189,248,0.18); }
        
        /* Bulletproof Native Structural Vectors for App Interfaces */
        .logo-ctrip { width: 34px; height: 34px; background: linear-gradient(135deg, #2f80ed, #0055d4); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 16px; font-style: italic; box-shadow: 0 4px 12px rgba(47,128,237,0.3); }
        .logo-fliggy { width: 34px; height: 34px; background: linear-gradient(135deg, #ffde00, #ffb300); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #222; font-weight: 900; font-size: 18px; box-shadow: 0 4px 12px rgba(255,222,0,0.25); }
        .logo-qunar { width: 34px; height: 34px; background: linear-gradient(135deg, #00bcd4, #0097a7); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: -0.5px; box-shadow: 0 4px 12px rgba(0,188,212,0.25); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(20px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        
        /* 🌟 Optimized Portrait Layout Modal Card for Login/Register Form */
        .modal-content-vertical { background: #0b0f19; padding: 2.5rem 2.25rem; border-radius: 2rem; max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 25px 70px -10px rgba(0,0,0,0.7); }
        .modal-content-guide { background: #090d16; padding: 2.25rem; border-radius: 2rem; max-width: 600px; width: 92%; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.08); }
        
        .loading-spinner { border: 3px solid rgba(56, 189, 248, 0.1); border-top-color: #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.65s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .globe-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; background: #020409; }
        .status-bar { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(20px); padding: 14px 36px; border-radius: 50px; font-family: monospace; font-size: 14px; z-index: 30; color: #fff; box-shadow: 0 25px 60px rgba(0,0,0,0.85); text-align: center; }
        
        /* Perfect Sizing Symmetry Realized Across Browsers */
        select, input[type="date"], input[type="text"], input[type="password"], input[type="email"] { background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 14px 16px; border-radius: 12px; width: 100%; outline: none; transition: all 0.25s; font-size: 0.95rem; line-height: 1.25rem; height: 52px; box-sizing: border-box; }
        select:focus, input[type="date"]:focus, input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus { border-color: #38bdf8; background: rgba(3, 7, 18, 0.85); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18); }
        select { -webkit-appearance: none; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen flex flex-col justify-between">
    <div>
        <header class="border-b border-white/[0.06] bg-slate-950/40 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer group" id="homeBtn">
                    <div class="w-8 h-8 rounded-lg bg-sky-500/10 flex items-center justify-center border border-sky-500/20 group-hover:bg-sky-500/20 transition">
                        <i class="fas fa-plane text-sm text-sky-400"></i>
                    </div>
                    <span class="text-md font-bold tracking-tight text-white/90 group-hover:text-white transition">SkySmart Engine</span>
                </div>
                <div id="authButtons" class="flex gap-2"></div>
            </div>
        </header>
        <main id="mainContent"></main>
    </div>
    
    <footer class="border-t border-white/[0.04] bg-slate-950/20 py-8 text-center text-xs text-slate-500 font-mono tracking-wider">
        <p>Engine Pipeline Array Platform Configuration &copy; 2026</p>
        <p class="mt-2 bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent font-bold">OPERATIONAL CORE MATRIX DIVISION: 304txt</p>
    </footer>
</div>

<div id="guideModal" class="modal"><div class="modal-content-guide"><button id="closeGuideModal" class="float-right text-neutral-400 hover:text-white text-2xl">&times;</button><div id="guideContent"></div></div></div>

<div id="authModal" class="modal"><div class="modal-content-vertical relative"><button id="closeAuthModal" class="absolute top-4 right-5 text-neutral-400 hover:text-white text-2xl transition">&times;</button><div id="authFormContainer"></div></div></div>

<script>
let currentUser = null;
let currentScreen = 'search';
let searchResults = null;
let searchForm = { from_city: 'CAN', to_city: 'JFK', date: new Date().toISOString().slice(0,10) };
let routeDistance = 0;
let earthAnimation = null;

const airports = {
    "CAN":"Guangzhou","PVG":"Shanghai","PEK":"Beijing","HKG":"Hong Kong","SZX":"Shenzhen",
    "HGH":"Hangzhou","CTU":"Chengdu","CKG":"Chongqing","XIY":"Xi'an","KMG":"Kunming",
    "JFK":"New York","LAX":"Los Angeles","LHR":"London","SIN":"Singapore",
    "NRT":"Tokyo","HND":"Haneda","CDG":"Paris","ICN":"Seoul","BKK":"Bangkok",
    "DXB":"Dubai","FRA":"Frankfurt","AMS":"Amsterdam"
};

const airportCoords = {
    "PVG":[31.1443,121.8083],"CAN":[23.3924,113.2988],"PEK":[40.0799,116.5976],
    "HKG":[22.3080,113.9185],"SZX":[22.6393,113.8107],"HGH":[30.2295,120.4344],
    "CTU":[30.5785,103.9471],"CKG":[29.7180,106.6417],"XIY":[34.4371,108.7516],
    "KMG":[25.1018,102.9292],"JFK":[40.6413,-73.7781],"LAX":[34.0522,-118.2437],
    "LHR":[51.4700,-0.4543],"SIN":[1.3644,103.9915],"NRT":[35.7720,140.3929],
    "HND":[35.5494,139.7798],"CDG":[49.0097,2.5479],"ICN":[37.4602,126.4407],
    "BKK":[13.6900,100.7501],"DXB":[25.2532,55.3657],"FRA":[50.0379,8.5622],
    "AMS":[52.3105,4.7683]
};

function updateHeader() {
    const c = document.getElementById('authButtons');
    if (!c) return;
    if (currentUser) {
        c.innerHTML = `<span class="text-xs font-mono mr-3 text-slate-400 self-center">${currentUser.username}</span><button id="logoutBtn" class="bg-slate-900 text-slate-300 border border-white/[0.06] px-4 py-1.5 rounded-xl text-xs font-medium hover:bg-slate-800 transition">Sign Out</button>`;
        document.getElementById('logoutBtn').onclick = () => { currentUser=null; localStorage.removeItem('user'); updateHeader(); renderScreen(); };
    } else {
        c.innerHTML = `<button id="showLoginBtn" class="text-slate-400 px-4 py-1.5 rounded-xl text-xs font-medium hover:text-white transition">Sign In</button><button id="showRegisterBtn" class="bg-sky-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold hover:bg-sky-500 shadow-lg shadow-sky-600/15 transition">Sign Up</button>`;
        document.getElementById('showLoginBtn').onclick = () => showAuthModal('login');
        document.getElementById('showRegisterBtn').onclick = () => showAuthModal('register');
    }
}

function renderScreen() {
    const main = document.getElementById('mainContent');
    if (!main) return;
    if (currentScreen === 'search') {
        main.innerHTML = renderSearch();
        attachSearchEvents();
    } else if (currentScreen === 'loading') {
        main.innerHTML = `<div class="h-[calc(100vh-8rem)] flex flex-col items-center justify-center bg-[#01030a]"><div class="loading-spinner"></div><p class="text-slate-400 font-mono tracking-widest text-[10px]">ESTABLISHING DATA COUPLING ARRANGEMENTS...</p></div>`;
        startEarthAnimation();
    } else if (currentScreen === 'results') {
        if (earthAnimation) { if(earthAnimation.stop) earthAnimation.stop(); earthAnimation=null; }
        main.innerHTML = renderResults();
        attachResultsEvents();
    }
}

function renderSearch() {
    let opts = '', opts2 = '';
    for (let [code, city] of Object.entries(airports)) {
        opts += `<option value="${code}" ${code===searchForm.from_city?'selected':''}>${code} · ${city}</option>`;
        opts2 += `<option value="${code}" ${code===searchForm.to_city?'selected':''}>${code} · ${city}</option>`;
    }
    return `
        <div class="max-w-4xl mx-auto px-6 pt-24 pb-36">
            <div class="text-center mb-16">
                <div class="inline-block px-3 py-1 rounded-full bg-sky-500/10 text-sky-400 text-[10px] font-bold uppercase tracking-widest mb-4">REAL-TIME GLOBAL METASEARCH INTERFACE</div>
                <h1 class="text-5xl md:text-6xl font-black bg-gradient-to-b from-white via-slate-200 to-slate-500 bg-clip-text text-transparent tracking-tight">Smart Flight Metasearch</h1>
                <p class="text-slate-400 mt-4 text-sm md:text-base max-w-xl mx-auto font-light leading-relaxed">Instantly benchmark multi-channel market tracking rates across <span class="font-normal text-slate-200">携程</span> · <span class="font-normal text-slate-200">飞猪</span> · <span class="font-normal text-slate-200">去哪儿</span> seamlessly.</p>
            </div>
            
            <form id="searchForm" class="glass-panel p-2.5 rounded-[26px] shadow-2xl space-y-2.5 max-w-3xl mx-auto">
                <div class="bg-slate-950/40 rounded-[20px] p-4 border border-white/[0.02]">
                    <div class="grid md:grid-cols-12 gap-3 relative items-center">
                        <div class="md:col-span-4 bg-slate-900/40 p-2.5 rounded-xl border border-white/[0.04] relative flex flex-col justify-center h-[72px]">
                            <label class="block text-[9px] font-bold uppercase text-slate-500 tracking-wider mb-0.5 pl-1">Departure From</label>
                            <select id="fromCity" class="cursor-pointer bg-transparent border-none focus:ring-0 text-white font-bold text-md pr-8">${opts}</select>
                            <div class="absolute right-4 bottom-4 text-slate-500 pointer-events-none text-xs"><i class="fas fa-chevron-down"></i></div>
                        </div>
                        
                        <div class="absolute left-1/2 md:left-[33.33%] top-1/2 md:top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 my-auto">
                            <button type="button" id="switchRouteBtn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 border border-white/10 flex items-center justify-center transition shadow-md active:scale-95 text-slate-400 hover:text-sky-400">
                                <i class="fas fa-exchange-alt text-xs"></i>
                            </button>
                        </div>

                        <div class="md:col-span-4 bg-slate-900/40 p-2.5 rounded-xl border border-white/[0.04] relative flex flex-col justify-center h-[72px] md:pl-6">
                            <label class="block text-[9px] font-bold uppercase text-slate-500 tracking-wider mb-0.5 pl-1 md:pl-5">Arrival Location</label>
                            <select id="toCity" class="cursor-pointer bg-transparent border-none focus:ring-0 text-white font-bold text-md pr-8 md:pl-4">${opts2}</select>
                            <div class="absolute right-4 bottom-4 text-slate-500 pointer-events-none text-xs"><i class="fas fa-chevron-down"></i></div>
                        </div>

                        <div class="md:col-span-4 bg-slate-900/40 p-2.5 rounded-xl border border-white/[0.04] flex flex-col justify-center h-[72px] relative">
                            <label class="block text-[9px] font-bold uppercase text-slate-500 tracking-wider mb-0.5 pl-1">Target Date</label>
                            <input type="date" id="departDate" value="${searchForm.date}" class="bg-transparent border-none focus:ring-0 text-white font-semibold text-sm cursor-pointer pr-4">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:opacity-95 py-4 rounded-xl font-bold text-white transition shadow-lg shadow-blue-900/20 tracking-wide text-xs uppercase flex items-center justify-center gap-2">
                    <span>Scan Live Flight Channels</span>
                    <i class="fas fa-arrow-right text-xs opacity-70"></i>
                </button>
            </form>
        </div>
    `;
}

function attachSearchEvents() {
    const form = document.getElementById('searchForm');
    if (!form) return;
    
    document.getElementById('switchRouteBtn').onclick = () => {
        const fromSel = document.getElementById('fromCity');
        const toSel = document.getElementById('toCity');
        const temp = fromSel.value;
        fromSel.value = toSel.value;
        toSel.value = temp;
    };

    form.onsubmit = (e) => {
        e.preventDefault();
        searchForm.from_city = document.getElementById('fromCity').value;
        searchForm.to_city = document.getElementById('toCity').value;
        searchForm.date = document.getElementById('departDate').value;
        if (searchForm.from_city === searchForm.to_city) { alert("Origin and Target matrices must diverge."); return; }
        currentScreen = 'loading';
        renderScreen();
    };
}

function startEarthAnimation() {
    if (earthAnimation) earthAnimation.stop();
    const container = document.createElement('div');
    container.className = 'globe-container';
    document.body.appendChild(container);
    const statusDiv = document.createElement('div');
    statusDiv.className = 'status-bar';
    statusDiv.id = 'earthStatus';
    statusDiv.innerHTML = 'Analyzing system tracking arrays...';
    document.body.appendChild(statusDiv);

    if (typeof THREE === 'undefined') {
        setTimeout(() => { container.remove(); statusDiv.remove(); fetchSearchResults(); }, 500);
        return;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020409);
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: earthMap,
        normalMap: earthNormalMap,
        normalScale: new THREE.Vector2(0.8, 0.8),
        shininess: 8
    });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(5, 64, 64), earthMaterial);
    earth.rotation.y = 0;
    scene.add(earth);

    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(600 * 3);
    for (let i = 0; i < 600 * 3; i++) starPositions[i] = (Math.random() - 0.5) * 400;
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.3 }));
    scene.add(stars);

    scene.add(new THREE.AmbientLight(0x444444));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(15, 10, 12);
    scene.add(sunLight);

    function latLonToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180) - (Math.PI / 2);
        return new THREE.Vector3(
            -radius * Math.sin(phi) * Math.sin(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.cos(theta)
        );
    }

    const fromCoords = airportCoords[searchForm.from_city];
    const toCoords = airportCoords[searchForm.to_city];
    
    const startVec = latLonToVector3(fromCoords[0], fromCoords[1], 5.01);
    const endVec = latLonToVector3(toCoords[0], toCoords[1], 5.01);
    
    const nodeGeo = new THREE.SphereGeometry(0.05, 16, 16);
    const b1 = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8 })); b1.position.copy(startVec); scene.add(b1);
    const b2 = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0xfacc15 })); b2.position.copy(endVec); scene.add(b2);

    const points = [];
    for (let i = 0; i <= 90; i++) {
        const t = i / 90;
        const p = new THREE.Vector3().lerpVectors(startVec, endVec, t).normalize();
        const altitude = Math.sin(t * Math.PI) * 1.2; 
        p.multiplyScalar(5.01 + altitude);
        points.push(p);
    }

    const trajectory = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0x38bdf8, opacity: 0.8, transparent: true })
    );
    scene.add(trajectory);

    const probe = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.24, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x38bdf8 }));
    probe.geometry.rotateX(Math.PI / 2);
    scene.add(probe);

    let startTime = performance.now();
    const flightDuration = 3600;
    let animFrame;

    function animate() {
        const elapsed = performance.now() - startTime;
        let t = Math.min(1, elapsed / flightDuration);
        const currentIdx = Math.floor(t * (points.length - 1));
        const pos = points[currentIdx];
        
        if (pos) {
            probe.position.copy(pos);
            if (currentIdx < points.length - 1) probe.lookAt(points[currentIdx + 1]);
            
            const viewFacingCamera = pos.clone().normalize().multiplyScalar(7.0);
            camera.position.copy(pos).add(viewFacingCamera).add(new THREE.Vector3(0, 1.0, 0));
            camera.lookAt(pos);
        }
        
        renderer.render(scene, camera);
        const statusSpan = document.getElementById('earthStatus');
        if (statusSpan) statusSpan.innerHTML = `🛰 Pipeline Querying ${Math.floor(t*100)}% · Profiling ${searchForm.from_city} &rarr; ${searchForm.to_city}`;
        
        if (t < 1) {
            animFrame = requestAnimationFrame(animate);
        } else {
            cancelAnimationFrame(animFrame);
            container.remove();
            statusDiv.remove();
            fetchSearchResults();
        }
    }

    animFrame = requestAnimationFrame(animate);
    earthAnimation = { stop: () => { cancelAnimationFrame(animFrame); container.remove(); if(statusDiv) statusDiv.remove(); } };
}

function fetchSearchResults() {
    fetch('/data/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from_city: searchForm.from_city, to_city: searchForm.to_city, date: searchForm.date })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            searchResults = data;
            routeDistance = data.distance_km;
            currentScreen = 'results';
            renderScreen();
        } else { alert('Array compilation error.'); currentScreen='search'; renderScreen(); }
    })
    .catch(() => { alert('Network connection lost.'); currentScreen='search'; renderScreen(); });
}

function renderResults() {
    if (!searchResults?.flights) return '<div class="p-10 text-center text-slate-500 font-mono text-xs">No configuration profiles compiled matching criteria.</div>';
    const flightsHtml = searchResults.flights.map(f => {
        const minP = f.min_platform;
        const isMin = (p) => p === minP;
        
        return `
            <div class="bg-slate-900/30 backdrop-blur-md border border-white/[0.05] rounded-3xl p-6 space-y-6 shadow-xl">
                <div class="flex justify-between items-start">
                    <div><h3 class="text-base font-bold text-white/90">${f.airline}</h3><p class="text-[10px] font-mono text-slate-500 mt-0.5">${f.flight_number}</p></div>
                    <span class="bg-slate-800/60 border border-white/[0.04] text-slate-300 font-mono px-2.5 py-1 rounded-lg text-xs">${f.duration}</span>
                </div>
                <div class="flex justify-between items-center text-center px-5 bg-slate-950/40 py-4 rounded-2xl border border-white/[0.01]">
                    <div class="text-left"><p class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Depart</p><p class="text-lg font-mono font-bold text-white mt-0.5">${f.departure_time}</p><p class="text-xs font-bold text-sky-400 mt-0.5">${searchForm.from_city}</p></div>
                    <div class="flex flex-col items-center flex-1 mx-4"><i class="fas fa-plane text-slate-800 text-xs"></i><div class="w-full border-t border-dashed border-slate-800/80 my-1"></div></div>
                    <div class="text-right"><p class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Arrive</p><p class="text-lg font-mono font-bold text-white mt-0.5">${f.arrival_time}</p><p class="text-xs font-bold text-amber-500 mt-0.5">${searchForm.to_city}</p></div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="brand-card ${isMin('携程') ? 'ring-1.5 ring-blue-500 bg-blue-950/20 border-blue-500/30' : ''}">
                        <div class="logo-ctrip">C</div>
                        <p class="text-xs font-bold text-slate-400 mt-2.5">携程</p>
                        <p class="text-md font-mono font-black mt-1 text-blue-400">¥${f.prices.携程}</p>
                        ${isMin('携程') ? '<span class="text-[9px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full mt-2 font-medium tracking-wide">Best Price</span>' : ''}
                    </div>
                    <div class="brand-card ${isMin('飞猪') ? 'ring-1.5 ring-yellow-500 bg-yellow-950/20 border-yellow-500/30' : ''}">
                        <div class="logo-fliggy">F</div>
                        <p class="text-xs font-bold text-slate-400 mt-2.5">飞猪</p>
                        <p class="text-md font-mono font-black mt-1 text-yellow-500">¥${f.prices.飞猪}</p>
                        ${isMin('飞猪') ? '<span class="text-[9px] bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded-full mt-2 font-medium tracking-wide">Best Price</span>' : ''}
                    </div>
                    <div class="brand-card ${isMin('去哪儿') ? 'ring-1.5 ring-cyan-400 bg-cyan-950/20 border-cyan-400/30' : ''}">
                        <div class="logo-qunar">Q</div>
                        <p class="text-xs font-bold text-slate-400 mt-2.5">去哪儿</p>
                        <p class="text-md font-mono font-black mt-1 text-cyan-400">¥${f.prices.去哪儿}</p>
                        ${isMin('去哪儿') ? '<span class="text-[9px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded-full mt-2 font-medium tracking-wide">Best Price</span>' : ''}
                    </div>
                </div>
                <button class="saveBtn w-full bg-slate-900 hover:bg-slate-800 border border-white/[0.04] text-slate-400 font-medium py-3 rounded-xl text-xs tracking-wide transition shadow-inner" data-flight='${JSON.stringify(f)}'><i class="far fa-bookmark mr-2 text-sky-400"></i>Monitor Price Stream</button>
            </div>
        `;
    }).join('');
    
    return `
        <div class="max-w-6xl mx-auto px-6 py-12">
            <div class="flex flex-col md:flex-row md:justify-between md:items-center border-b border-white/[0.06] pb-6 mb-8 gap-4">
                <button id="backBtn" class="self-start bg-slate-900 hover:bg-slate-800 border border-white/[0.05] px-4 py-2.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center gap-2"><i class="fas fa-arrow-left text-[10px]"></i> Modify Criteria</button>
                <div class="text-left md:text-right">
                    <h2 class="text-2xl font-black tracking-tight text-white">${airports[searchForm.from_city]} &rarr; ${airports[searchForm.to_city]}</h2>
                    <p class="text-xs font-mono text-slate-500 mt-1">Geodesic Matrix Delta: <span class="text-slate-300 font-bold">${routeDistance} KM</span> · Interval window: ${searchForm.date}</p>
                </div>
            </div>
            <div class="flex justify-between items-center bg-sky-500/[0.02] border border-sky-500/10 p-5 rounded-2xl mb-10 shadow-sm">
                <span class="text-xs text-slate-400"><i class="fas fa-info-circle text-sky-400 mr-2"></i>Review geographic landscape metadata dossiers for the destination zone.</span>
                <button id="guideBtn" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2 rounded-xl text-xs font-bold tracking-wide transition">Launch Guide</button>
            </div>
            <div class="grid md:grid-cols-2 gap-6" id="flightsContainer">${flightsHtml}</div>
            ${currentUser ? renderWatchlist() : ''}
        </div>
    `;
}

function renderWatchlist() {
    if (!currentUser.saved_flights?.length) return `<div class="mt-16 pt-10 border-t border-slate-900"><h3 class="text-xs font-bold uppercase tracking-widest text-slate-500">Active Pipeline Feeds</h3><p class="text-slate-600 text-xs mt-2">No data parameters being intercepted.</p></div>`;
    const list = currentUser.saved_flights.map(f => `
        <div class="flex justify-between items-center p-4 bg-slate-950/40 border border-white/[0.03] rounded-2xl">
            <div><span class="font-bold text-sm text-white/95">${f.flight_number}</span> <span class="text-xs font-mono text-slate-500">(${f.airline})</span><br><span class="text-xs text-sky-400 font-mono mt-0.5 inline-block">Intercept Stream Target: ¥${f.prices[f.min_platform]} via ${f.min_platform}</span></div>
            <button class="deleteWatchlistBtn text-slate-600 hover:text-red-400 p-2.5 transition" data-flight-id="${f.flight_id}"><i class="fas fa-trash-alt text-sm"></i></button>
        </div>
    `).join('');
    return `<div class="mt-16 pt-10 border-t border-slate-900"><h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-5">Active Pipeline Feeds</h3><div class="space-y-3">${list}</div></div>`;
}

function attachResultsEvents() {
    document.getElementById('backBtn')?.addEventListener('click', () => { currentScreen='search'; renderScreen(); });
    document.getElementById('guideBtn')?.addEventListener('click', () => openGuideModal(searchForm.to_city));
    document.querySelectorAll('.saveBtn').forEach(btn => {
        btn.onclick = () => saveFlight(JSON.parse(btn.dataset.flight));
    });
    document.querySelectorAll('.deleteWatchlistBtn').forEach(btn => {
        btn.onclick = () => deleteFlight(btn.dataset.flightId);
    });
}

function saveFlight(flight) {
    if (!currentUser) { alert('Authentication token challenge requested.'); showAuthModal('login'); return; }
    fetch('/data/watchlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, flight: flight })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            currentUser = data.user;
            localStorage.setItem('user', JSON.stringify(currentUser));
            renderScreen();
        }
    });
}

function deleteFlight(flightId) {
    if (!currentUser) return;
    fetch('/data/watchlist/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, flight_id: flightId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            currentUser = data.user;
            localStorage.setItem('user', JSON.stringify(currentUser));
            renderScreen();
        }
    });
}

function openGuideModal(code) {
    const modal = document.getElementById('guideModal');
    const content = document.getElementById('guideContent');
    if (!modal) return;
    modal.classList.add('active');
    content.innerHTML = '<div class="loading-spinner"></div>';
    
    fetch(`/data/destination/${code}`)
        .then(res => res.json())
        .then(data => {
            content.innerHTML = `
                <div class="relative h-60 rounded-2xl overflow-hidden mb-6 border border-white/[0.06]">
                    <img src="${data.photoUrl}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#090d16] via-transparent to-transparent"></div>
                    <h2 class="absolute bottom-4 left-5 text-xl font-black text-white tracking-tight">${data.city} · ${data.country}</h2>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed font-light">${data.intro}</p>
                <div class="grid grid-cols-2 gap-4 mt-6 text-[11px] font-mono">
                    <div class="bg-slate-950/60 p-3.5 rounded-xl border border-white/[0.04]"><i class="fas fa-thermometer-half text-sky-400 mr-2"></i><strong>Telemetry Zone</strong><br class="mb-1"><span class="text-slate-400">${data.weather.temp}°C, ${data.weather.condition}</span></div>
                    <div class="bg-slate-950/60 p-3.5 rounded-xl border border-white/[0.04]"><i class="fas fa-utensils text-yellow-500 mr-2"></i><strong>Culinary Dossier</strong><br class="mb-1"><span class="text-slate-400">${data.foods.join(', ')}</span></div>
                </div>
                <div class="mt-5 text-[11px] text-slate-400"><strong>Signature Landscapes:</strong> <span class="text-slate-200 font-medium">${data.topAttractions.join(', ')}</span></div>
                <div class="mt-2 text-[11px] text-slate-400"><strong>Optimal Operational Window:</strong> <span class="text-slate-200 font-medium">${data.bestTimeToVisit}</span></div>
                <div class="mt-4 text-[11px] bg-amber-500/[0.04] border border-amber-500/20 p-4 rounded-xl text-amber-400/90 leading-normal"><strong>Transit Advisory:</strong> ${data.travelTips}</div>
            `;
        })
        .catch(() => content.innerHTML = '<p class="text-center text-slate-500 py-6 text-xs font-mono">Dossier extraction pipeline timeout error.</p>');
}

// 🌟 3. Beautiful Vertical Form Layout & Refined Human Placeholders Implementation
function showAuthModal(mode) {
    const modal = document.getElementById('authModal');
    const container = document.getElementById('authFormContainer');
    if (!modal) return;
    modal.classList.add('active');
    
    container.innerHTML = `
        <div class="flex flex-col items-center text-center mt-3 mb-6">
            <div class="w-12 h-12 rounded-2xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center mb-4 text-sky-400 shadow-inner">
                <i class="fas ${mode === 'login' ? 'fa-user-shield' : 'fa-user-plus'} text-xl"></i>
            </div>
            <h3 class="text-xl font-extrabold text-white tracking-tight">${mode === 'login' ? 'Welcome Back' : 'Create Account'}</h3>
            <p class="text-slate-400 text-xs mt-1.5 font-light max-w-[240px] leading-relaxed">
                ${mode === 'login' ? 'Sign in to monitor live market flight data feeds.' : 'Register to unlock multi-channel price streams tracking.'}
            </p>
        </div>
        
        <div class="flex flex-col gap-3.5">
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"><i class="fas fa-user"></i></span>
                <input id="authUser" type="text" placeholder="Username / 账户名称" class="pl-11 pr-4">
            </div>
            
            ${mode === 'register' ? `
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"><i class="fas fa-envelope"></i></span>
                <input id="authEmail" type="email" placeholder="Email Address / 电子邮箱" class="pl-11 pr-4">
            </div>
            ` : ''}
            
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"><i class="fas fa-lock"></i></span>
                <input id="authPass" type="password" placeholder="Password / 密码安全凭证" class="pl-11 pr-4">
            </div>
            
            <button id="authSubmit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:opacity-95 text-white py-3.5 rounded-xl font-bold text-xs tracking-wider uppercase transition mt-2 shadow-lg shadow-sky-500/10">
                ${mode === 'login' ? 'Sign In Now' : 'Complete Registration'}
            </button>
        </div>
        
        <p class="text-center text-xs text-slate-400 mt-6 font-light">
            ${mode === 'login' ? "Don't have an account?" : 'Already have an account?'} 
            <a href="#" id="toggleAuthMode" class="text-sky-400 font-medium hover:text-sky-300 transition underline ml-1">${mode === 'login' ? 'Sign Up' : 'Log In'}</a>
        </p>
    `;
    
    document.getElementById('authSubmit').onclick = () => {
        const username = document.getElementById('authUser').value;
        const password = document.getElementById('authPass').value;
        const email = mode === 'register' ? document.getElementById('authEmail')?.value : '';
        const endpoint = mode === 'login' ? '/data/auth/login' : '/data/auth/register';
        const body = mode === 'login' ? {username, password} : {username, email, password};
        
        if (!username || !password || (mode === 'register' && !email)) {
            alert('Please fill out all credential inputs.');
            return;
        }

        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                updateHeader();
                modal.classList.remove('active');
                renderScreen();
            } else alert(data.message);
        });
    };
    
    document.getElementById('toggleAuthMode').onclick = (e) => {
        e.preventDefault();
        showAuthModal(mode === 'login' ? 'register' : 'login');
    };
}

function closeAuthModal() { document.getElementById('authModal')?.classList.remove('active'); }
function closeGuideModal() { document.getElementById('guideModal')?.classList.remove('active'); }

document.addEventListener('click', (e) => {
    if (e.target.id === 'closeAuthModal') closeAuthModal();
    if (e.target.id === 'closeGuideModal') closeGuideModal();
});

window.onload = () => {
    const stored = localStorage.getItem('user');
    if (stored) try { currentUser = JSON.parse(stored); } catch(e) {}
    updateHeader();
    renderScreen();
    document.getElementById('homeBtn').onclick = () => { currentScreen='search'; renderScreen(); };
};
</script>
</body>
</html>
